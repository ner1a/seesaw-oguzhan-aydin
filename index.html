<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Seesaw Oğuzhan AYDIN</title>
  </head>
  <body>
    <div class="container">
      <!-- Info Card Panel -->
      <div class="info-panel">
        <div class="info-card left-info">
          <h3>LEFT WEIGHT</h3>
          <span class="" id="left-weight">0 kg</span>
        </div>
        <div class="info-card angle-info">
          <h3>ANGLE</h3>
          <span class="weight" id="angle">0°</span>
        </div>
        <div class="info-card right-info">
          <h3>RIGHT WEIGHT</h3>
          <span class="weight" id="right-weight">0 kg</span>
        </div>
      </div>

      <!-- Seesaw Canvas -->
      <div id="canvas-container">
        <canvas id="seesaw-canvas"></canvas>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="reset-btn" id="reset-button">Reset Seesaw</button>
      </div>
    </div>
    <script src="seesaw.js"></script>
  </body>
</html>
